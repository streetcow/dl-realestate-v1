name: Auto Crawl and Update Apartment Options

on:
  schedule:
    - cron: '0 0 * * 1' # 매주 월요일 UTC 기준 자정 (한국 시간 월요일 아침 9시)에 자동 실행
  workflow_dispatch: # 깃허브 웹에서 버튼 하나로 수동 즉시 실행할 수도 있습니다!

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas pymupdf google-generativeai

      - name: Run Crawler Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }} # 깃허브 Secrets에 등록한 API 키 연동
        run: |
          python run_full_batch_pipeline.py

      - name: Commit and push updated CSV
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add apartment_options_master_db.csv
          git commit -m "🤖 자동 크롤링: 마스터 CSV 데이터 최신화 완료" || echo "No changes to commit"
          git push
