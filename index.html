    <!-- 자바스크립트 로직 (실제 CSV 자동 로드 버전) -->
    <script>
        let globalData = [];
        let barChartInstance = null;
        let lineChartInstance = null;

        // 페이지가 열리자마자 깃허브에 업로드된 실제 마스터 CSV 파일을 자동으로 불러옵니다.
        window.addEventListener('DOMContentLoaded', function() {
            // 본인의 깃허브 주소에 맞춰 경로 설정 (같은 저장소에 있는 경우 파일명만 적어도 됩니다)
            const csvUrl = 'apartment_options_master_db.csv'; 

            Papa.parse(csvUrl, {
                download: true,
                header: true,
                dynamicTyping: true,
                skipEmptyLines: true,
                complete: function(results) {
                    globalData = results.data;
                    initDashboard();
                },
                error: function(err) {
                    console.log("자동 로드 실패 (수동 업로드를 이용해주세요):", err);
                }
            });
        });

        // 수동 파일 업로드 시에도 정상 작동
        document.getElementById('csvFile').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            Papa.parse(file, {
                header: true,
                dynamicTyping: true,
                skipEmptyLines: true,
                complete: function(results) {
                    globalData = results.data;
                    initDashboard();
                }
            });
        });

        function initDashboard() {
            populateDropdowns();
            updateDashboard(globalData);
        }

        function populateDropdowns() {
            const categories = [...new Set(globalData.map(item => item.표준대분류).filter(Boolean))];
            const housingTypes = [...new Set(globalData.map(item => item.주택형).filter(Boolean))];

            const catSelect = document.getElementById('filterCategory');
            const houseSelect = document.getElementById('filterHousingType');

            catSelect.innerHTML = '<option value="ALL">전체 보기</option>';
            houseSelect.innerHTML = '<option value="ALL">전체 보기</option>';

            categories.forEach(cat => {
                catSelect.innerHTML += `<option value="${cat}">${cat}</option>`;
            });
            housingTypes.forEach(house => {
                houseSelect.innerHTML += `<option value="${house}">${house}</option>`;
            });
        }

        function filterData() {
            const selectedCat = document.getElementById('filterCategory').value;
            const selectedHouse = document.getElementById('filterHousingType').value;

            return globalData.filter(item => {
                const matchCat = (selectedCat === 'ALL' || item.표준대분류 === selectedCat);
                const matchHouse = (selectedHouse === 'ALL' || String(item.주택형) === selectedHouse);
                return matchCat && matchHouse;
            });
        }

        function updateDashboard(data) {
            const totalItems = data.length;
            const uniqueComplexes = new Set(data.map(item => item.단지명)).size;
            const prices = data.map(item => Number(item.공급금액_원) || 0);
            const avgPrice = prices.length ? prices.reduce((a, b) => a + b, 0) / prices.length : 0;
            const maxPrice = prices.length ? Math.max(...prices) : 0;

            document.getElementById('kpiTotalItems').innerText = `${totalItems.toLocaleString()} 개`;
            document.getElementById('kpiTotalComplexes').innerText = `${uniqueComplexes} 개소`;
            document.getElementById('kpiAvgPrice').innerText = `${Math.round(avgPrice).toLocaleString()} 원`;
            document.getElementById('kpiMaxPrice').innerText = `${maxPrice.toLocaleString()} 원`;

            renderBarChart(data);
            renderLineChart(data);
        }

        function renderBarChart(data) {
            const grouped = {};
            data.forEach(item => {
                const cat = item.표준대분류 || '기타';
                if (!grouped[cat]) grouped[cat] = { sum: 0, count: 0 };
                grouped[cat].sum += (Number(item.공급금액_원) || 0);
                grouped[cat].count += 1;
            });

            const labels = Object.keys(grouped);
            const averages = labels.map(cat => Math.round(grouped[cat].sum / grouped[cat].count));

            const ctx = document.getElementById('barChart').getContext('2d');
            if (barChartInstance) barChartInstance.destroy();

            barChartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: '평균 공급금액 (원)',
                        data: averages,
                        backgroundColor: 'rgba(37, 99, 235, 0.8)',
                        borderRadius: 8
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } }
                }
            });
        }

        function renderLineChart(data) {
            const grouped = {};
            data.forEach(item => {
                const quarter = item.분양분기 || '미상';
                if (!grouped[quarter]) grouped[quarter] = { sum: 0, count: 0 };
                grouped[quarter].sum += (Number(item.공급금액_원) || 0);
                grouped[quarter].count += 1;
            });

            const sortedQuarters = Object.keys(grouped).sort();
            const averages = sortedQuarters.map(q => Math.round(grouped[q].sum / grouped[q].count));

            const ctx = document.getElementById('lineChart').getContext('2d');
            if (lineChartInstance) lineChartInstance.destroy();

            lineChartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: sortedQuarters,
                    datasets: [{
                        label: '분기별 평균 옵션가 (원)',
                        data: averages,
                        borderColor: 'rgb(79, 70, 229)',
                        backgroundColor: 'rgba(79, 70, 229, 0.1)',
                        fill: true,
                        tension: 0.3
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false
                }
            });
        }

        document.getElementById('filterCategory').addEventListener('change', () => updateDashboard(filterData()));
        document.getElementById('filterHousingType').addEventListener('change', () => updateDashboard(filterData()));
        document.getElementById('resetFilter').addEventListener('click', () => {
            document.getElementById('filterCategory').value = 'ALL';
            document.getElementById('filterHousingType').value = 'ALL';
            updateDashboard(globalData);
        });
    </script>
